[package]
name = "cybermanju-db"
version = "0.1.1"
edition = "2021"
description = "redb database layer with parent index"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# Only keystore sealing is used here; native PQC C bindings cannot be
# compiled by the WASM database consumer. Native crypto users keep defaults.
cybermanju-crypto = { path = "../crypto", default-features = false }
cybermanju-types = { path = "../types" }
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
