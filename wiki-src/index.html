<!doctype html>
<!-- CyberManju OS — wiki app shell (wiki-src/index.html). -->
<!-- Role: mounts the Three.js scenery + reader panels; data comes from subjects.json. -->
<!-- Exports: #scene canvas mount, #rail, #panel, #tooltip mounts. -->
<!-- Integrates: built by vite.config.wiki.ts into dist-wasm/wiki/; fetches ./subjects.json. -->
<!-- Contracts: fully static, no backend; hash routes (#/id) mirror wiki/<id>.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyberManju OS — 3D wiki</title>
    <meta
      name="description"
      content="Interactive Three.js wiki for CyberManju OS: orbit the manju, click a module, read the docs. Static pages + llms.txt for agents."
    />
    <meta name="theme-color" content="#0d0714" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="tooltip" hidden></div>

    <header class="top">
      <a class="brand" href="#/">
        <span class="manju" aria-hidden="true"></span>
        <span>CyberManju <b>wiki</b></span>
      </a>
      <input id="search" type="search" placeholder="Search modules + symbols…" autocomplete="off" />
      <nav class="toplinks">
        <a href="./agent.html">static</a>
        <a href="../llms.txt">llms.txt</a>
        <a href="../">app</a>
      </nav>
    </header>

    <aside class="rail" id="rail" aria-label="Wiki subjects"></aside>

    <section class="panel" id="panel" aria-live="polite"></section>

    <footer class="hint">drag to orbit · scroll to zoom · click a glowing module · <code>/</code> search · double-click empty space to go home</footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
