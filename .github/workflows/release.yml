name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust: Lint & Test (gate) ─────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release tag matches the version everywhere
        run: bash scripts/check-version.sh --tag "${GITHUB_REF#refs/tags/}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  # ─── WASM: Build for Web ─────────────────────────────────────────
  wasm-build:
    name: Build WASM (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build WASM
        run: npm run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-wasm
          path: dist-wasm/
          retention-days: 30
          if-no-files-found: error

  # ─── Windows: Build Desktop ──────────────────────────────────────
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    needs: rust-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/*/*.msi
            target/release/bundle/*/*.exe
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Desktop (deb + AppImage + rpm) ──────────────────
  linux-build:
    name: Build Linux (deb+AppImage+rpm)
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev \
            libfuse2 \
            rpm-build

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/*.deb
            target/release/bundle/*/*.AppImage
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: error

      - name: Upload RPM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build RPM ────────────────────────────────────────────
  rpm-build:
    name: Build Linux (RPM)
    runs-on: ubuntu-latest
    needs: [rust-check, linux-build]
    steps:
      - name: Download RPM from linux-build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-rpm
          path: rpm-out

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rpm
          path: rpm-out/*.rpm
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Flatpak ────────────────────────────────────────
  flatpak-build:
    name: Build Linux (Flatpak)
    runs-on: ubuntu-latest
    needs: [rust-check, linux-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Debian package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-deb
          path: artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/com.cybermanju.os.yml
          flatpak build-bundle repo cybermanju-os.flatpak com.cybermanju.os

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-flatpak
          path: cybermanju-os.flatpak
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Arch Package ────────────────────────────────────
  arch-build:
    name: Build Linux (Arch/CachyOS)
    runs-on: ubuntu-latest
    needs: [rust-check, linux-build]
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            libsoup3 \
            pkg-config \
            openssl \
            curl \
            sudo \
            xdg-utils \
            rpm-tools \
            fuse2 \
            dpkg \
            patchelf \
            desktop-file-utils

      # See ci.yml: linuxdeploy's gtk plugin dies on the loader directory
      # that gdk-pixbuf2 2.44 stopped shipping while its .pc file still
      # advertises it. Recreate it so the AppImage bundle can proceed.
      - name: Restore gdk-pixbuf loader directory
        run: mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fix ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install Rust
        run: |
          sudo -u builder bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
          sudo -u builder bash -c 'source $HOME/.cargo/env && rustup default stable'

      - name: Install Node.js
        run: pacman -S --noconfirm nodejs npm

      # NO_STRIP: linuxdeploy's bundled strip cannot read the .relr.dyn
      # sections Arch-built libraries carry (tauri#8929).
      # APPIMAGE_EXTRACT_AND_RUN: no /dev/fuse in this container.
      - name: Build Arch package
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            export NO_STRIP=true
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd $GITHUB_WORKSPACE
            npm ci
            npm run tauri build || npm run tauri -- build --verbose
          "

      - name: Collect artifacts
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE
          sudo -u builder bash -c '
            mkdir -p dist-arch
            cp target/release/bundle/deb/*.deb dist-arch/ 2>/dev/null || true
            cp target/release/bundle/appimage/*.AppImage dist-arch/ 2>/dev/null || true
          '

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-arch
          path: dist-arch/
          retention-days: 30
          if-no-files-found: error

  # ─── macOS: Build Desktop (dmg + app) ────────────────────────────
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    needs: rust-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/*/*.dmg
            target/release/bundle/*/*.app
          retention-days: 30
          if-no-files-found: error

  # ─── Android: Build APK ──────────────────────────────────────────
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: rust-check
    env:
      # Pinned to the AGP default (AGP 9.x release notes) — see ci.yml.
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The pinned action's default ('tools platform-tools') fails:
          # the legacy 'tools' package was removed from the SDK repository.
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          sdkmanager --licenses <<< "y"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Initialize Android project
        run: npx tauri android init
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # A release APK must be installable, so a missing keystore is a hard
      # failure here (REQUIRE_SIGNING) rather than a warning.
      - name: Configure Android release signing
        run: bash scripts/android-signing.sh prepare
        env:
          REQUIRE_SIGNING: "1"
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android APK
        # ort-sys only ships prebuilt ONNX Runtime for aarch64 on Android.
        run: npx tauri android build --target aarch64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Verify Android APK signature
        run: bash scripts/android-signing.sh verify
        env:
          REQUIRE_SIGNING: "1"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

  # ─── Docker: Build & Publish to GHCR ──────────────────────────────
  docker-build:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: rust-check
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image name
        id: image
        # GHCR requires a lowercase repository path.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/cybermanju-os" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: docker pull "${{ steps.image.outputs.name }}:latest"

  # ─── Create GitHub Release ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - rust-check
      - wasm-build
      - windows-build
      - linux-build
      - rpm-build
      - flatpak-build
      - arch-build
      - macos-build
      - android-build
      - docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: List downloaded artifacts
        run: find artifacts/ -type f | head -100

      # A job can go green while producing nothing (an upload with the default
      # `warn` policy). Fail here instead of shipping a release with a hole.
      - name: Check every release format is present
        run: |
          missing=0
          check() {
            local dir="$1"; shift
            if [ ! -d "artifacts/$dir" ]; then
              echo "::error::artifact '$dir' was not produced"
              missing=1
              return
            fi
            local pat
            for pat in "$@"; do
              if ! find "artifacts/$dir" -name "$pat" -print -quit | grep -q .; then
                echo "::error::artifact '$dir' contains no $pat"
                missing=1
              fi
            done
          }
          check release-windows  "*.exe" "*.msi"
          check release-linux    "*.deb" "*.AppImage"
          check release-rpm      "*.rpm"
          check release-flatpak  "*.flatpak"
          check release-arch     "*.AppImage"
          check release-macos    "*.dmg"
          check release-android  "*.apk"
          check dist-wasm        "index.html"
          exit $missing

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          # Previous tag = newest tag other than the one being released.
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$CURRENT_TAG" | head -1 || true)
          # Published image name — must match the docker-build job above.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cybermanju-os"
          
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since $PREV_TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$CURRENT_TAG" >> release_notes.md
          else
            echo "### Initial Release" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | File |" >> release_notes.md
          echo "|----------|------|" >> release_notes.md
          echo "| Windows | \`dist-windows.zip\` (MSI/NSIS installers) |" >> release_notes.md
          echo "| Linux | \`dist-linux.zip\` (deb + AppImage) |" >> release_notes.md
          echo "| Linux (RPM) | \`dist-rpm.zip\` (RPM for Fedora/RHEL) |" >> release_notes.md
          echo "| Linux (Flatpak) | \`dist-flatpak.zip\` (Universal Linux) |" >> release_notes.md
          echo "| Linux (Arch) | \`dist-arch.zip\` (deb + AppImage on Arch) |" >> release_notes.md
          echo "| macOS | \`dist-macos.zip\` (DMG) |" >> release_notes.md
          echo "| Android | \`dist-android.zip\` (signed APK, arm64-v8a) |" >> release_notes.md
          echo "| Web (WASM) | \`dist-wasm.zip\` (static files for any web server) |" >> release_notes.md
          echo "| Docker | \`docker pull ${IMAGE}:latest\` |" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Docker" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "# LAN-only by default; publish on your NAS address with -p 192.168.x.x:3456:3456" >> release_notes.md
          echo "docker run -d -p 127.0.0.1:3456:3456 -v /DATA/AppData/cybermanju-os/config:/data ${IMAGE}:latest" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Windows**: Download and run the \`.exe\` installer" >> release_notes.md
          echo "- **Linux (Debian/Ubuntu)**: Install the \`.deb\` package" >> release_notes.md
          echo "- **Linux (Fedora/RHEL)**: Install the \`.rpm\` package" >> release_notes.md
          echo "- **Linux (Flatpak)**: \`flatpak install cybermanju-os.flatpak\`" >> release_notes.md
          echo "- **Linux (Arch/CachyOS)**: Run the \`.AppImage\` or build from AUR" >> release_notes.md
          echo "- **macOS**: Open the \`.dmg\` and drag to Applications" >> release_notes.md
          echo "- **Android**: Enable unknown sources, install the \`.apk\` (arm64-v8a devices only)" >> release_notes.md
          echo "- **Web**: Extract \`.zip\` and serve with any static file server" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Verify downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sha256sum -c SHA256SUMS.txt" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Package artifacts
        run: |
          mkdir -p packages
          
          # Package Windows artifacts
          if [ -d "artifacts/release-windows" ]; then
            cd artifacts/release-windows
            zip -r ../../packages/dist-windows.zip .
            cd ../..
          fi
          
          # Package Linux artifacts
          if [ -d "artifacts/release-linux" ]; then
            cd artifacts/release-linux
            zip -r ../../packages/dist-linux.zip .
            cd ../..
          fi
          
          # Package RPM artifacts
          if [ -d "artifacts/release-rpm" ]; then
            cd artifacts/release-rpm
            zip -r ../../packages/dist-rpm.zip .
            cd ../..
          fi
          
          # Package Flatpak artifacts
          if [ -d "artifacts/release-flatpak" ]; then
            cd artifacts/release-flatpak
            zip -r ../../packages/dist-flatpak.zip .
            cd ../..
          fi
          
          # Package Arch artifacts
          if [ -d "artifacts/release-arch" ]; then
            cd artifacts/release-arch
            zip -r ../../packages/dist-arch.zip .
            cd ../..
          fi
          
          # Package macOS artifacts
          if [ -d "artifacts/release-macos" ]; then
            cd artifacts/release-macos
            zip -r ../../packages/dist-macos.zip .
            cd ../..
          fi
          
          # Package Android artifacts
          if [ -d "artifacts/release-android" ]; then
            cd artifacts/release-android
            zip -r ../../packages/dist-android.zip .
            cd ../..
          fi
          
          # Package WASM artifacts
          if [ -d "artifacts/dist-wasm" ]; then
            cd artifacts/dist-wasm
            zip -r ../../packages/dist-wasm.zip .
            cd ../..
          fi
          
          # List all packages
          ls -la packages/

      - name: Generate checksums
        run: |
          (cd packages && sha256sum * > SHA256SUMS.txt)
          cat packages/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CyberManju OS ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
