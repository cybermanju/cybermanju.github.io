# CyberManju OS — independent unit-test workflows (.github/workflows/unit-tests.yml).
# Role: run language and platform unit/regression suites without gating the main build or Pages deploy.
# Integrates: Rust workspace, Vue/Vitest, Python/Android JVM, Go and offline installer regressions.
# Contract: no build/deploy job depends on this workflow; production build, metadata, WASM, Ren'Py and deployment smoke stay in ci.yml.
name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: >-
          npm test -- --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000
          --teardownTimeout=15000 --reporter=default --reporter=hanging-process

  rust-unit-tests:
    name: Rust workspace unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin ONNX Runtime download cache
        run: echo "ORT_CACHE_DIR=$HOME/.cache/ort" >> "$GITHUB_ENV"

      - name: Install system dependencies (for Tauri)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          version: "1.1"

      - name: Verify system dependencies (repair on mirror 404)
        run: |
          if ! pkg-config --exists 'glib-2.0 >= 2.70'; then
            echo "glib-2.0.pc missing — retrying apt with a fresh index"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          fi
          pkg-config --modversion glib-2.0
          pkg-config --exists 'glib-2.0 >= 2.70'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true
          shared-key: "linux-workspace"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Cache ONNX Runtime prebuilt binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort
          key: ort-dfbin-rust-check-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Regenerate ort-sys native link metadata
        run: |
          rm -rf target/release/build/ort-sys-* target/release/.fingerprint/ort-sys-*
          rm -rf target/debug/build/ort-sys-* target/debug/.fingerprint/ort-sys-*

      - name: Run Android/native crypto command regressions (host IPC)
        run: cargo test --locked -p cybermanju-os-desktop --lib native_crypto_tests -- --nocapture

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace --no-fail-fast

  python-platform-unit-tests:
    name: Python, Android JVM and REST harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REQUIRE_KOTLIN_COMPILER: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kotlin-compiler-2.0.21.zip"
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip \
            --output "$archive"
          echo '0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  '"$archive" | sha256sum --check --status
          install_dir="$RUNNER_TEMP/kotlin-compiler"
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          kotlin_lib="$install_dir/kotlinc/lib"
          test -f "$kotlin_lib"/kotlin-compiler-embeddable-*.jar
          test -f "$kotlin_lib"/kotlin-stdlib-*.jar
          test -f "$kotlin_lib"/annotations-*.jar
          classpath="$(printf '%s:' "$kotlin_lib"/*.jar)"
          echo "KOTLIN_LIB=$kotlin_lib" >> "$GITHUB_ENV"
          echo "KOTLIN_COMPILER_CLASSPATH=${classpath%:}" >> "$GITHUB_ENV"

      - name: REST HTTP smoke harness unit tests
        run: node --test scripts/smoke-rest-http.test.mjs

      - name: Ren'Py runtime metadata unit tests
        run: python3 tests/python/test_renpy_ci_metadata.py

      - name: Android package verifier unit tests
        run: python3 scripts/verify-android-package.test.py

      - name: Android clipboard unit tests
        run: python3 tests/python/test_android_clipboard.py

      - name: Android widget installer unit tests
        run: python3 tests/python/test_android_widgets.py

      - name: Android HOME lifecycle JVM unit tests
        run: python3 tests/python/test_android_home_lifecycle.py

      - name: Android HOME role installer unit tests
        run: python3 tests/python/test_android_home_role_installer.py

      - name: Android HOME role lifecycle JVM unit tests
        run: python3 tests/python/test_android_home_role_runtime.py

      - name: Android widget host lifecycle JVM unit tests
        run: python3 tests/python/test_android_widgets_runtime.py

  go-unit-tests:
    name: Go CLI unit and installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Go vet and unit tests
        working-directory: cli
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Termux installer safety unit tests
        run: |
          bash -n cli/scripts/install-termux.sh cli/scripts/install-termux_test.sh
          bash cli/scripts/install-termux_test.sh
