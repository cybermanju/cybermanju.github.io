name: CI

on:
  push:
    branches: [main]
    # A push that only touches prose cannot change a single byte of compiled
    # output — skip the whole ~15-minute pipeline for it. (Deliberately
    # scoped to `push` only: `pull_request` still runs everything so a
    # required check can never go missing.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI is always a cold start, and `Swatinem/rust-cache` deletes incremental
  # artifacts before saving (it does not cache workspace crates at all), so
  # paying for them here only buys compiler time that gets thrown away.
  # Incremental compilation stays ON for local development — see
  # `.cargo/config.toml` and the `[profile.dev]`/`[profile.test]` tables in
  # the root `Cargo.toml`. This env var overrides both.
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Meta: versions + license agree ───────────────────────────────
  meta-check:
    name: Version & Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Versions agree everywhere
        run: bash scripts/check-version.sh

      - name: License file exists
        run: test -f LICENSE

  # ─── Rust: Lint & Test ─────────────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      # Workspace-wide: `src-tauri` alone has no tests, so a current-package-only
      # run silently executed zero tests (all crates/tests live outside it).
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  # ─── Docker: Build Image ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cybermanju-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: docker images cybermanju-os:latest

  # ─── Dependency audit (advisory until the tree is clean) ──────────
  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Prebuilt binary. `cargo install cargo-audit --locked` compiles
      # ~300 crates from source on every single run for no reason.
      - name: Install cargo-audit
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: cargo-audit

      # Findings are reported but not blocking yet — remove
      # `continue-on-error` once the advisory list is clean.
      - name: cargo audit
        continue-on-error: true
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: npm audit (production)
        continue-on-error: true
        run: npm audit --omit=dev

  # ─── WASM: Rust crate + web bundle ────────────────────────────────
  wasm-build:
    name: Build WASM (crate + web bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Item 17: the Rust half. These steps are what make CI fail when
      # crates/os-wasm stops compiling for the browser target.
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: cargo check os-wasm for wasm32
        run: cargo check --target wasm32-unknown-unknown -p cybermanju-os-wasm

      # Prebuilt binary; building wasm-pack from source costs minutes.
      - name: Install wasm-pack
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: wasm-pack

      - name: wasm-pack build (assertion)
        run: wasm-pack build crates/os-wasm --target web --out-dir pkg

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No `node_modules` cache: `npm ci` deletes the directory before it
      # installs, so restoring it buys nothing. `setup-node`'s `cache: npm`
      # above is what actually speeds this up (it keeps `~/.npm`).

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Frontend unit tests
        run: npm test

      # Keep the freshly built pkg in place so the vite step's alias to
      # crates/os-wasm/pkg resolves to the wasm backend (integrated
      # into the dist-wasm bundle rather than fetched at runtime).
      - name: Build WASM bundle
        run: npm run build:wasm:frontend

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-wasm
          path: dist-wasm/
          retention-days: 7
          if-no-files-found: error

  # ─── Windows: Build Desktop ──────────────────────────────────────
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-windows
          path: target/release/bundle/**/*
          retention-days: 7
          if-no-files-found: error

  # ─── Linux: Build .deb, .AppImage & .rpm ──────────────────────────
  linux-build:
    name: Build Linux (deb+AppImage+rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libssl-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

      - name: Upload RPM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: error

  # ─── Linux: Build RPM ────────────────────────────────────────────
  rpm-build:
    name: Build Linux (RPM)
    runs-on: ubuntu-latest
    # Only waits for the job that produces `dist-linux-rpm`, not for lint.
    needs: linux-build
    steps:
      - name: Download RPM from linux-build
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-linux-rpm
          path: rpm-out

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-rpm
          path: rpm-out/*.rpm
          retention-days: 7
          if-no-files-found: error

  # ─── Linux: Build Flatpak ────────────────────────────────────────
  flatpak-build:
    name: Build Linux (Flatpak)
    runs-on: ubuntu-latest
    # Only waits for `dist-linux-deb`, not for lint.
    needs: linux-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Debian package
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-linux-deb
          path: artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/com.cybermanju.os.yml
          flatpak build-bundle repo cybermanju-os.flatpak com.cybermanju.os

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-flatpak
          path: cybermanju-os.flatpak
          retention-days: 7
          if-no-files-found: error

  # ─── Linux: Build Arch Package ────────────────────────────────────
  arch-build:
    name: Build Linux (Arch/CachyOS)
    runs-on: ubuntu-latest
    # Deliberately waits on nothing: this job runs its own rustup + full
    # build inside an Arch container and downloads no artifacts from any
    # other job, so `needs` here was pure latency (11 minutes of it).
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            libsoup3 \
            pkg-config \
            openssl \
            curl \
            sudo \
            xdg-utils \
            rpm-tools \
            fuse2 \
            dpkg \
            patchelf \
            desktop-file-utils

      # gdk-pixbuf2 2.44 on Arch moved image decoding into glycin and no
      # longer ships the legacy loader directory, but gdk-pixbuf-2.0.pc still
      # reports gdk_pixbuf_binarydir=/usr/lib/gdk-pixbuf-2.0/2.10.0.
      # linuxdeploy's gtk plugin `realpath`s that path and aborts with
      # `cp: cannot stat ''` when it is absent. Recreate it (empty, exactly
      # what a current Arch install has) so the plugin can copy it.
      - name: Restore gdk-pixbuf loader directory
        run: mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fix ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install Rust
        run: |
          sudo -u builder bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
          sudo -u builder bash -c 'source $HOME/.cargo/env && rustup default stable'

      - name: Install Node.js
        run: pacman -S --noconfirm nodejs npm

      # NO_STRIP: linuxdeploy's bundled strip cannot read the .relr.dyn sections
      # Arch-built libraries carry, which aborts the AppImage bundle with
      # `failed to run linuxdeploy` (tauri#8929 / #13113, reported on Garuda).
      # APPIMAGE_EXTRACT_AND_RUN: no /dev/fuse in this container, so the
      # AppImage-based tools unpack and exec themselves instead of mounting.
      # The --verbose retry exists because the bundler swallows linuxdeploy's
      # stderr at the default log level; the first run stays quiet when green.
      - name: Build Arch package
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            export NO_STRIP=true
            export APPIMAGE_EXTRACT_AND_RUN=1
            cd $GITHUB_WORKSPACE
            npm ci
            npm run tauri build || npm run tauri -- build --verbose
          "

      - name: Collect artifacts
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE
          sudo -u builder bash -c '
            mkdir -p dist-arch
            cp target/release/bundle/deb/*.deb dist-arch/ 2>/dev/null || true
            cp target/release/bundle/appimage/*.AppImage dist-arch/ 2>/dev/null || true
          '

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-arch
          path: dist-arch/
          retention-days: 7
          if-no-files-found: error

  # ─── Android: Build APK ──────────────────────────────────────────
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      # Pinned to the AGP default (AGP 9.x release notes). The Tauri template
      # sets compileSdk/targetSdk 36 with no ndkVersion, so Gradle demands
      # platform android-36, build-tools 36.0.0 and this exact NDK. Both
      # NDK vars must point here: Tauri reads NDK_HOME for the Rust linker,
      # and without it the runner's newest preinstalled NDK (r29) is used
      # for Rust while Gradle wants this one.
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The pinned action's default ('tools platform-tools') fails:
          # the legacy 'tools' package was removed from the SDK repository.
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Initialize Android project
        run: npm run tauri android init
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # Without this Gradle emits `*-release-unsigned.apk`, which Android
      # refuses to install. The keystore only exists as a repo secret.
      - name: Configure Android release signing
        run: bash scripts/android-signing.sh prepare
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android APK
        # ort-sys ships prebuilt ONNX Runtime only for aarch64-linux-android on
        # Android; the other Rust ABIs have no dist entry, so build arm64-v8a.
        run: npm run tauri android build -- --target aarch64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Verify Android APK signature
        run: bash scripts/android-signing.sh verify

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

  # ─── macOS: Build Desktop ────────────────────────────────────────
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          retention-days: 7
          if-no-files-found: error

  # ─── Deploy: GitHub Pages ─────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: wasm-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-wasm
          path: dist-wasm/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-wasm/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
