name: Ren'Py Web CI

# Called by the main OS CI: one source SHA, one validated runtime artifact.
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  renpy-web-build:
    name: Ren'Py Web build, ZIP checks, and browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/renpy-technosutra/requirements-renpy-build.txt

      - name: Install pinned Python build dependencies
        working-directory: integrations/renpy-technosutra
        run: python -m pip install --disable-pip-version-check -r requirements-renpy-build.txt

      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.62.0

      - name: Install Chromium and Xvfb for smoke testing
        working-directory: integrations/renpy-technosutra
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Cache official Ren'Py SDK and Web downloads
        id: renpy-download-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renpy-downloads
          key: renpy-downloads-${{ runner.os }}-8.5.3-sdk-eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45-web-954db897e65f51ea63cb2fb7b203d02be0447f4e22069514020bbe6c6691fdfc

      - name: Install official Ren'Py 8.5.3 SDK and Web support
        working-directory: integrations/renpy-technosutra
        env:
          RENPY_DOWNLOAD_CACHE: ${{ runner.temp }}/renpy-downloads
        run: bash tools/install_renpy_sdk.sh "$RUNNER_TEMP/renpy-8.5.3-sdk"

      - name: Generate scripts and validate compact inputs
        working-directory: integrations/renpy-technosutra
        run: |
          bash -n build_web.sh tools/install_renpy_sdk.sh
          python tools/generate_renpy_script.py
          python tools/generate_master_sprite_script.py
          python tools/prepare_assets.py
          python tools/validate_optimized_assets.py

      - name: Build and smoke-test Ren'Py Web candidate
        working-directory: integrations/renpy-technosutra
        env:
          RENPY_SDK: ${{ runner.temp }}/renpy-8.5.3-sdk
        run: bash build_web.sh

      - name: Verify candidate reports before export
        working-directory: integrations/renpy-technosutra
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          build = Path("build/local") / os.environ["BUILD_ID"]
          report = json.loads((build / "build-report.json").read_text(encoding="utf-8"))
          smoke = json.loads((build / "smoke-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS", report
          assert smoke["status"] == "PASS", smoke
          assert report["authorizedSpritesIncluded"] is True
          assert report["runtimeSpriteCount"] == 54
          assert report["runtimeSpriteSha256Verified"] is True
          assert report["spriteManifestPreserved"] is True
          assert report["captureManifestPreserved"] is True
          assert report["rawSourceCapturePngsInPackage"] is False
          assert report["missingSpriteSlots"] == [43, 52]
          assert report["optimizedImageCount"] == 56
          assert report["smokeTest"]["status"] == "PASS"
          print(f"PASS: candidate {build}; startup/assets smoke only, not a complete playthrough")
          PY
          python tools/ci_runtime_metadata.py export \
            --build-report "build/local/$BUILD_ID/build-report.json" \
            --runtime-dir "build/local/$BUILD_ID/output" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Export validated runtime to the OS WASM job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renpy-web-runtime
          path: integrations/renpy-technosutra/build/local/${{ env.BUILD_ID }}/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve Ren'Py build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renpy-build-diagnostics
          path: |
            integrations/renpy-technosutra/build/local/${{ env.BUILD_ID }}/build-report.json
            integrations/renpy-technosutra/build/local/${{ env.BUILD_ID }}/smoke-report.json
            integrations/renpy-technosutra/build/local/${{ env.BUILD_ID }}/build.log
          if-no-files-found: warn
          retention-days: 7
