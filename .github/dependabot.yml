# Keeps dependencies and the pinned Actions up to date (AGENT-4 item 18).
# Actions are pinned to commit SHAs, so the github-actions ecosystem is what
# keeps them current — each update PR rewrites the pin and keeps the version
# comment next to it.
#
# Updates are GROUPED (one PR per ecosystem, not one per dependency). Every
# open Dependabot PR rebases onto each push to main and each rebase fires the
# full CI pipeline via `pull_request` — ungrouped that meant ~17 branches x
# full runs per push. Groups keep it at 3 branches max with the same checks.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
